<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="naver-maps-ncp-key-id" content="147egmm9a5">
    <title>호포기지 도면 로컬 테스트</title>
    <link rel="stylesheet" href="style.css?v=production-adoption-5">
</head>

<body class="map-mode">
    <div class="app-container">
        <header>
            <h1 class="header-title">호포기지 도면 로컬 테스트</h1>
        </header>

        <main>
            <section id="mapView" class="map-view" aria-label="호포기지 도면 지도">
                <div id="mapZoomStage" class="map-zoom-stage">
                    <div id="naverMap" class="naver-map" aria-label="네이버 지도"></div>
                    <svg id="cadOverlay" class="cad-map-overlay" aria-hidden="true"
                        xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
                </div>
                <div id="mapLoading" class="map-loading">지도를 불러오는 중입니다.</div>

                <div id="mapTopControls" class="map-type-controls" aria-label="지도 기능">
                    <div id="mapPrimaryControls" class="map-primary-controls">
                        <button id="mapTypeToggleBtn" class="active" type="button" aria-pressed="true"
                            title="일반지도로 전환">위성지도</button>
                        <button id="displaySettingsBtn" type="button" aria-controls="cadLayerPanel"
                            aria-expanded="false">표시설정</button>
                        <button id="mapSearchBtn" class="map-search-open" type="button" aria-label="도면 문자 검색"
                            title="도면 문자 검색">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="10.8" cy="10.8" r="6.2"></circle>
                                <path d="m15.4 15.4 4.4 4.4"></path>
                            </svg>
                        </button>
                    </div>
                    <div id="mapSearchPanel" class="map-search-panel" hidden>
                        <button id="mapSearchBackBtn" class="map-search-back" type="button"
                            aria-label="검색 취소">&lt;</button>
                        <input id="mapSearchInput" type="search" inputmode="search" autocomplete="off"
                            spellcheck="false" placeholder="도면 문자 검색" aria-label="도면 문자 검색어">
                    </div>
                    <section id="mapSearchResults" class="map-search-results" aria-label="도면 문자 검색 결과" hidden>
                        <p id="mapSearchStatus" class="map-search-status" role="status" aria-live="polite"></p>
                        <div id="mapSearchList" class="map-search-list"></div>
                    </section>
                    <div id="mapSearchNavigation" class="map-search-navigation" aria-label="검색 결과 이동" hidden>
                        <button id="mapSearchNavigationText" class="map-search-navigation-text" type="button"
                            title="검색 결과 목록 다시 보기">검색텍스트</button>
                        <span id="mapSearchNavigationLayer" class="map-search-navigation-layer">레이어</span>
                        <span id="mapSearchNavigationStatus" class="map-search-navigation-count" aria-live="polite">0/0</span>
                        <button id="mapSearchPrevBtn" class="map-search-navigation-arrow" type="button" aria-label="이전 검색 결과">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 15 7-7 7 7"></path></svg>
                        </button>
                        <button id="mapSearchNextBtn" class="map-search-navigation-arrow" type="button" aria-label="다음 검색 결과">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"></path></svg>
                        </button>
                    </div>
                </div>

                <div class="map-zoom-controls" aria-label="지도 확대 축소">
                    <button id="zoomInBtn" type="button" aria-label="지도 확대">+</button>
                    <button id="zoomOutBtn" type="button" aria-label="지도 축소">−</button>
                </div>

                <button id="currentLocationBtn" class="map-current-location" type="button"
                    title="현재위치" aria-label="현재위치 실시간 추적 시작" aria-pressed="false">
                    <svg viewBox="0 0 32 32" aria-hidden="true">
                        <circle cx="16" cy="16" r="10.5"></circle>
                        <circle class="location-dot" cx="16" cy="16" r="2.2"></circle>
                        <path d="M16 2.5v5M16 24.5v5M2.5 16h5M24.5 16h5"></path>
                    </svg>
                </button>

                <div id="mapLocationStatus" class="map-location-status" role="status" aria-live="polite"></div>

                <aside id="cadLayerPanel" class="cad-layer-panel" aria-label="도면 레이어" hidden>
                    <div class="cad-layer-heading">
                        <h2>도면 레이어</h2>
                        <span id="cadLayerStatus">불러오는 중</span>
                    </div>
                    <div class="cad-layer-actions" aria-label="레이어 일괄 선택">
                        <button id="cadCoreLayersBtn" type="button">핵심</button>
                        <button id="cadAllLayersBtn" type="button">전체</button>
                        <button id="cadNoLayersBtn" type="button">해제</button>
                    </div>
                    <label class="cad-layer-setting">
                        <span>투명도</span>
                        <input id="cadOpacity" type="range" min="20" max="100" value="80">
                    </label>
                    <div class="cad-layer-setting cad-label-setting">
                        <label><input id="cadLabelToggle" type="checkbox" checked><span>문자</span></label>
                        <div class="cad-label-size-options" role="group" aria-label="문자 크기">
                            <button type="button" class="active" data-cad-label-size="small" aria-pressed="true">작게</button>
                            <button type="button" data-cad-label-size="medium" aria-pressed="false">중간</button>
                            <button type="button" data-cad-label-size="large" aria-pressed="false">크게</button>
                        </div>
                    </div>
                    <div id="cadLayerList" class="cad-layer-list" aria-label="도면 레이어 목록"></div>
                    <p id="cadLayerMessage">호포차량기지 도면을 준비하고 있습니다.</p>
                </aside>
            </section>
        </main>
    </div>

    <script src="map.js?v=hopo-cad-naver-7"></script>
    <script>
        if (window.location.protocol === 'file:') {
            const loading = document.getElementById('mapLoading');
            loading.textContent = '로컬 웹 서버로 열어 주세요. 예: python -m http.server 8080';
            loading.classList.add('error');
        } else {
            window.BWAMap.initialize();
        }
    </script>
</body>

</html>
