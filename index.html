<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>ERP 점검 웹앱</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com https://*.googleusercontent.com https://firestore.googleapis.com https://asia-northeast3-btcwebapp-551bd.cloudfunctions.net https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://dapi.kakao.com https://*.daumcdn.net http://*.daumcdn.net; img-src 'self' data: https://*.daumcdn.net http://*.daumcdn.net https://*.kakaocdn.net; style-src 'self' 'unsafe-inline'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com https://dapi.kakao.com https://*.daumcdn.net http://*.daumcdn.net; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
    <link rel="stylesheet" href="style.css?v=production-adoption-2">
    <link rel="prefetch" href="./notifications.html?v=production-notifications-3" as="document">
    <link rel="prefetch" href="./notification-settings.html?v=production-notifications-3" as="document">
    <link rel="prefetch" href="./notifications.css?v=production-notifications-1" as="style">
    <link rel="prefetch" href="./notifications.js?v=production-notifications-1" as="script">
    <link rel="prefetch" href="./notification-settings.js?v=production-notifications-2" as="script">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ERP웹앱">
</head>

<body>
    <div class="app-container">
        <div id="overlay" class="overlay"></div>

        <header>
            <button id="homeBtn" class="icon-btn home-btn" title="처음으로" aria-label="처음으로">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M0 0h24v24H0V0z" fill="none" />
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5z" />
                </svg>
            </button>
            <h1 class="header-title">ERP 점검 웹앱</h1>
            <a id="notificationHistoryBtn" class="icon-btn notification-history-btn" href="./notifications.html?v=production-notifications-3"
                title="알림 내역" aria-label="알림 내역">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6v-5a7 7 0 0 0-5-6.71V3a2 2 0 1 0-4 0v1.29A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z" />
                    <path class="notification-off-mark" d="M4 4 20 20" />
                </svg>
            </a>
            <button class="hamburger-menu" id="hamburger" type="button" aria-label="메뉴 열기">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </button>
        </header>

        <nav id="sidenav" class="sidenav">
            <div class="sidenav-content">
                <div id="upload-section" class="sidenav-section">
                    <h3>새 양식 업로드</h3>
                    <input type="file" id="excelFile" accept=".xls,.xlsx" />
                    <button id="uploadBtn">업로드</button>
                </div>

                <div class="form-selector sidenav-section">
                    <h3>기존 양식 불러오기</h3>
                    <select id="formSelect">
                        <option value="">-- 양식을 선택해주세요 --</option>
                    </select>
                    <div id="formListStatus" style="margin-top: 5px; font-size: 0.9em;"></div>
                </div>

                <div class="sidenav-section reset-section">
                    <button id="resetFavoritesBtn" class="reset-button">⭐ 즐겨찾기 초기화</button>
                    <a class="notification-settings-link" href="./notification-settings.html?v=production-notifications-3">🔔 알림 설정</a>
                </div>
            </div>
        </nav>

        <main>
            <div id="status"></div>

            <div id="homeView">
                <div id="favoritesSection" class="favorites-section">
                    <h3>⭐ 즐겨찾기</h3>
                    <div class="fav-buttons-container">
                        <button id="favBtn1" class="fav-button" data-fav-id="1" disabled>로딩중</button>
                        <button id="favBtn2" class="fav-button" data-fav-id="2" disabled>로딩중</button>
                        <button id="favBtn3" class="fav-button" data-fav-id="3" disabled>로딩중</button>
                    </div>
                </div>

                <div id="dynamicFormContainer" class="form-section">
                    <h3>측정값 입력 폼</h3>
                    <p id="formMessage">메뉴(☰)를 열어 새 양식을 업로드하거나 기존 양식을 선택해주세요.</p>
                </div>

                <button id="openMapBtn" class="map-menu-button home-map-button" type="button">
                    호포기지 도면보기
                </button>
                <div class="home-spacer" aria-hidden="true"></div>
            </div>

            <section id="mapView" class="map-view view-hidden" aria-label="차량기지 도면 지도">
                <div id="mapZoomStage" class="map-zoom-stage">
                    <div id="kakaoMap" class="kakao-map" aria-label="카카오 지도"></div>
                    <svg id="cadOverlay" class="cad-map-overlay" aria-hidden="true"
                        xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
                </div>
                <div id="mapLoading" class="map-loading">지도를 불러오는 중입니다.</div>

                <div id="mapTopControls" class="map-type-controls" aria-label="지도 기능">
                    <div id="mapPrimaryControls" class="map-primary-controls">
                        <button id="mapTypeToggleBtn" class="active" type="button" aria-pressed="true"
                            title="일반지도로 전환">위성지도</button>
                        <button id="displaySettingsBtn" type="button" aria-controls="cadLayerPanel"
                            aria-expanded="false">표시설정</button>
                        <button id="detailZoomBtn" type="button" aria-pressed="false">추가확대</button>
                        <button id="mapSearchBtn" class="map-search-open" type="button" aria-label="도면 문자 검색"
                            title="도면 문자 검색">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="10.8" cy="10.8" r="6.2"></circle>
                                <path d="m15.4 15.4 4.4 4.4"></path>
                            </svg>
                        </button>
                    </div>
                    <div id="mapSearchPanel" class="map-search-panel" hidden>
                        <button id="mapSearchBackBtn" class="map-search-back" type="button"
                            aria-label="검색 취소">&lt;</button>
                        <input id="mapSearchInput" type="search" inputmode="search" autocomplete="off"
                            spellcheck="false" placeholder="도면 문자 검색" aria-label="도면 문자 검색어">
                    </div>
                    <section id="mapSearchResults" class="map-search-results" aria-label="도면 문자 검색 결과" hidden>
                        <p id="mapSearchStatus" class="map-search-status" role="status" aria-live="polite"></p>
                        <div id="mapSearchList" class="map-search-list"></div>
                    </section>
                </div>

                <div class="map-zoom-controls" aria-label="지도 확대 축소">
                    <button id="zoomInBtn" type="button" aria-label="지도 확대">+</button>
                    <button id="zoomOutBtn" type="button" aria-label="지도 축소">−</button>
                </div>

                <button id="currentLocationBtn" class="map-current-location" type="button"
                    title="현재 위치를 표시하고 이동" aria-label="현재 위치로 이동">
                    <svg viewBox="0 0 32 32" aria-hidden="true">
                        <circle cx="16" cy="16" r="10.5"></circle>
                        <circle class="location-dot" cx="16" cy="16" r="2.2"></circle>
                        <path d="M16 2.5v5M16 24.5v5M2.5 16h5M24.5 16h5"></path>
                    </svg>
                </button>

                <div id="mapLocationStatus" class="map-location-status" role="status" aria-live="polite"></div>

                <aside id="cadLayerPanel" class="cad-layer-panel" aria-label="도면 레이어" hidden>
                    <div class="cad-layer-heading">
                        <h2>도면 레이어</h2>
                        <span id="cadLayerStatus">불러오는 중</span>
                    </div>
                    <div class="cad-layer-actions" aria-label="레이어 일괄 선택">
                        <button id="cadCoreLayersBtn" type="button">핵심</button>
                        <button id="cadAllLayersBtn" type="button">전체</button>
                        <button id="cadNoLayersBtn" type="button">해제</button>
                    </div>
                    <label class="cad-layer-setting">
                        <span>투명도</span>
                        <input id="cadOpacity" type="range" min="20" max="100" value="80">
                    </label>
                    <label class="cad-layer-setting cad-label-setting">
                        <input id="cadLabelToggle" type="checkbox" checked>
                        <span>문자도 표시</span>
                    </label>
                    <div id="cadLayerList" class="cad-layer-list" aria-label="도면 레이어 목록"></div>
                    <p id="cadLayerMessage">호포차량기지 도면을 준비하고 있습니다.</p>
                </aside>
            </section>
        </main>
    </div>

    <div id="mapAuthOverlay" class="map-auth-overlay" hidden>
        <section class="map-auth-dialog" role="dialog" aria-modal="true" aria-labelledby="mapAuthTitle">
            <h2 id="mapAuthTitle">도면 지도 로그인</h2>
            <p>부산교통공사 이메일로 받은 6자리 인증코드를 입력하세요. 인증은 이 브라우저 또는 PWA에 유지됩니다.</p>
            <label class="map-auth-field" for="mapAuthEmail">
                <span>부산교통공사 이메일 아이디</span>
                <span class="map-auth-email-entry">
                    <input id="mapAuthEmail" type="text" inputmode="text" autocomplete="username"
                        autocapitalize="none" spellcheck="false" placeholder="아이디">
                    <span class="map-auth-email-domain" aria-hidden="true">@humetro.busan.kr</span>
                </span>
            </label>
            <button id="mapAuthSendCodeBtn" type="button">인증코드 받기</button>
            <div id="mapAuthCodeSection" hidden>
                <label class="map-auth-field" for="mapAuthCode">
                    <span>6자리 인증코드</span>
                    <input id="mapAuthCode" type="text" inputmode="numeric" autocomplete="one-time-code"
                        maxlength="6" pattern="[0-9]{6}" placeholder="000000">
                </label>
                <button id="mapAuthVerifyBtn" type="button">인증하고 도면 열기</button>
            </div>
            <p id="mapAuthMessage" class="map-auth-message" role="status" aria-live="polite"></p>
            <button id="mapAuthCancelBtn" class="map-auth-cancel" type="button">취소</button>
        </section>
    </div>

    <!-- Firebase SDK (Modular 형태가 아닌 Compat 버전을 사용하여 script 태그 로드) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="read-adapter.js?v=production-adoption-1"></script>
    <script src="production-read.js?v=production-adoption-1"></script>
    <script src="notification-store.js?v=production-notifications-1"></script>
    <script src="auth.js?v=map-auth-config-1"></script>
    <script src="map.js?v=hopo-cad-18"></script>
    <script src="script.js?v=production-adoption-4"></script>
</body>

</html>
