<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="color-scheme" content="light">
    <title>네이버 지도 모바일 줌 진단</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            color: #111;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .zoom-controls {
            position: fixed;
            z-index: 1000;
            top: max(16px, env(safe-area-inset-top));
            right: 16px;
            display: grid;
            grid-template-columns: 52px 54px 52px;
            height: 52px;
            overflow: hidden;
            border: 1px solid rgb(0 0 0 / 30%);
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 2px 10px rgb(0 0 0 / 25%);
        }

        .zoom-controls button {
            padding: 0;
            border: 0;
            background: #fff;
            color: #111;
            font: 700 28px/1 Arial, sans-serif;
        }

        .zoom-controls button:disabled {
            color: #aaa;
        }

        #zoomLevel {
            display: grid;
            place-items: center;
            border-right: 1px solid #ddd;
            border-left: 1px solid #ddd;
            font-size: 14px;
            font-weight: 700;
        }

        .diagnostic-panel {
            position: fixed;
            z-index: 1001;
            right: 12px;
            bottom: max(12px, env(safe-area-inset-bottom));
            left: 12px;
            overflow: hidden;
            border: 1px solid rgb(255 255 255 / 30%);
            border-radius: 12px;
            background: rgb(20 20 20 / 92%);
            color: #fff;
            box-shadow: 0 4px 20px rgb(0 0 0 / 35%);
        }

        .diagnostic-panel summary {
            display: flex;
            gap: 8px;
            align-items: center;
            min-height: 46px;
            padding: 10px 12px;
            cursor: pointer;
            list-style: none;
        }

        .diagnostic-panel summary::-webkit-details-marker {
            display: none;
        }

        .status-dot {
            flex: 0 0 10px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f5b400;
        }

        .status-dot.ok {
            background: #3dcc75;
        }

        .status-dot.error {
            background: #ff5252;
        }

        #summaryText {
            overflow: hidden;
            font-size: 14px;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .diagnostic-content {
            display: grid;
            gap: 8px;
            max-height: min(44vh, 390px);
            padding: 0 12px 12px;
            overflow: auto;
        }

        .diagnostic-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .diagnostic-actions button {
            min-height: 38px;
            border: 1px solid rgb(255 255 255 / 24%);
            border-radius: 8px;
            background: #333;
            color: #fff;
            font: inherit;
            font-weight: 700;
        }

        .diagnostic-grid {
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr);
            gap: 4px 10px;
            margin: 0;
            font-size: 12px;
            line-height: 1.45;
        }

        .diagnostic-grid dt {
            color: #aaa;
        }

        .diagnostic-grid dd {
            min-width: 0;
            margin: 0;
            overflow-wrap: anywhere;
        }

        #lastResult {
            margin: 0;
            padding: 8px;
            border-radius: 8px;
            background: #080808;
            color: #d9f99d;
            font: 11px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
    <script>
        window.__naverZoomDiagnostic = {
            build: '2026-08-23.1',
            pageStartedAt: performance.now(),
            sdkLoad: 'loading',
            authFailure: false,
            authFailureAt: null,
            reports: []
        };

        window.navermap_authFailure = function () {
            const state = window.__naverZoomDiagnostic;
            state.authFailure = true;
            state.authFailureAt = Number(performance.now().toFixed(3));
            window.dispatchEvent(new CustomEvent('naver-map-auth-failure'));
        };
    </script>
    <script id="naverSdk" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=147egmm9a5"
        onload="window.__naverZoomDiagnostic.sdkLoad='loaded';window.dispatchEvent(new CustomEvent('naver-map-sdk-loaded'))"
        onerror="window.__naverZoomDiagnostic.sdkLoad='network-error';window.dispatchEvent(new CustomEvent('naver-map-sdk-error'))"></script>
</head>

<body>
    <div id="map" aria-label="네이버 지도 모바일 줌 진단"></div>

    <div class="zoom-controls" aria-label="줌 애니메이션 테스트">
        <button id="zoomIn" type="button" aria-label="애니메이션 확대">+</button>
        <output id="zoomLevel" aria-label="현재 줌 레벨">17</output>
        <button id="zoomOut" type="button" aria-label="애니메이션 축소">−</button>
    </div>

    <details class="diagnostic-panel">
        <summary>
            <span id="statusDot" class="status-dot" aria-hidden="true"></span>
            <span id="summaryText">SDK 상태 확인 중</span>
        </summary>
        <div class="diagnostic-content">
            <div class="diagnostic-actions">
                <button id="copyReport" type="button">진단 결과 복사</button>
                <button id="clearReport" type="button">기록 초기화</button>
            </div>
            <dl class="diagnostic-grid">
                <dt>빌드</dt>
                <dd id="buildValue"></dd>
                <dt>Origin</dt>
                <dd id="originValue"></dd>
                <dt>브라우저</dt>
                <dd id="browserValue"></dd>
                <dt>화면</dt>
                <dd id="viewportValue"></dd>
                <dt>SDK 옵션</dt>
                <dd id="sdkOptionValue"></dd>
            </dl>
            <pre id="lastResult">아직 줌 기록이 없습니다. +/− 버튼 또는 핀치 줌을 실행하세요.</pre>
        </div>
    </details>

    <script>
        (() => {
            'use strict';

            const state = window.__naverZoomDiagnostic;
            const MIN_ZOOM = 5;
            const MAX_ZOOM = 21;
            const TRACE_LIMIT_MS = 1600;
            const RESTORE_GRACE_MS = 180;
            const elements = {
                statusDot: document.getElementById('statusDot'),
                summaryText: document.getElementById('summaryText'),
                buildValue: document.getElementById('buildValue'),
                originValue: document.getElementById('originValue'),
                browserValue: document.getElementById('browserValue'),
                viewportValue: document.getElementById('viewportValue'),
                sdkOptionValue: document.getElementById('sdkOptionValue'),
                lastResult: document.getElementById('lastResult'),
                copyReport: document.getElementById('copyReport'),
                clearReport: document.getElementById('clearReport'),
                zoomIn: document.getElementById('zoomIn'),
                zoomOut: document.getElementById('zoomOut'),
                zoomLevel: document.getElementById('zoomLevel')
            };
            let map = null;
            let marker = null;
            let svgOverlay = null;
            let activeTrace = null;

            function valueOrNull(callback) {
                try {
                    const value = callback();
                    return value === undefined ? null : value;
                } catch (error) {
                    return `ERROR: ${error?.message || error}`;
                }
            }

            function setStatus(text, tone = '') {
                elements.summaryText.textContent = text;
                elements.statusDot.className = `status-dot${tone ? ` ${tone}` : ''}`;
            }

            function browserSummary() {
                return `${navigator.userAgent} | platform=${navigator.platform} | touch=${navigator.maxTouchPoints}`;
            }

            function viewportSummary() {
                return `${innerWidth}×${innerHeight}, screen=${screen.width}×${screen.height}, dpr=${devicePixelRatio}`;
            }

            function sdkState() {
                const action = valueOrNull(() => map?.getMapAction?.());
                return {
                    sdkLoad: state.sdkLoad,
                    authFailure: state.authFailure,
                    mapOption: valueOrNull(() => map?.getOptions?.('overlayZoomEffect')),
                    actionOverlayZoomEffect: valueOrNull(() => action?.get?.('overlayZoomEffect')),
                    efOverlay: valueOrNull(() => action?.get?.('ef_overlay')),
                    efOverlayLayer: valueOrNull(() => action?.get?.('ef_overlaylayer')),
                    efOverlayImage: valueOrNull(() => action?.get?.('ef_overlayimage')),
                    efFloatPane: valueOrNull(() => action?.get?.('ef_floatpane')),
                    cssTransformProperty: 'transform' in document.documentElement.style,
                    cssTransformSupports: CSS.supports('transform', 'scale(1)')
                };
            }

            function updateEnvironment() {
                elements.buildValue.textContent = state.build;
                elements.originValue.textContent = `${location.origin}${location.pathname}`;
                elements.browserValue.textContent = browserSummary();
                elements.viewportValue.textContent = viewportSummary();
                elements.sdkOptionValue.textContent = JSON.stringify(sdkState());
            }

            function elementSnapshot(element) {
                if (!element) return null;
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return {
                    connected: element.isConnected,
                    inlineDisplay: element.style.display || '',
                    display: style.display,
                    visibility: style.visibility,
                    opacity: style.opacity,
                    transform: style.transform,
                    transformOrigin: style.transformOrigin,
                    zoom: style.zoom,
                    left: style.left,
                    top: style.top,
                    width: Number(rect.width.toFixed(3)),
                    height: Number(rect.height.toFixed(3)),
                    x: Number(rect.x.toFixed(3)),
                    y: Number(rect.y.toFixed(3))
                };
            }

            function currentFrame(trace) {
                const markerElement = valueOrNull(() => marker?.getElement?.());
                const panes = valueOrNull(() => marker?.getPanes?.());
                const markerPane = panes && typeof panes === 'object' ? panes.overlayImage : null;
                const svgElement = svgOverlay?.element || null;
                const svgPane = panes && typeof panes === 'object' ? panes.overlayLayer : null;
                const overlayPane = markerPane?.parentElement || null;
                const snapshot = {
                    elapsed: Number((performance.now() - trace.startedAt).toFixed(3)),
                    zoom: valueOrNull(() => map?.getZoom?.()),
                    marker: elementSnapshot(markerElement),
                    markerPane: elementSnapshot(markerPane),
                    svg: elementSnapshot(svgElement),
                    svgPane: elementSnapshot(svgPane),
                    overlayPane: elementSnapshot(overlayPane),
                    sdk: sdkState()
                };
                snapshot.signature = JSON.stringify({
                    zoom: snapshot.zoom,
                    markerDisplay: snapshot.marker?.display,
                    markerSize: [snapshot.marker?.width, snapshot.marker?.height],
                    markerPaneDisplay: snapshot.markerPane?.display,
                    markerPaneInlineDisplay: snapshot.markerPane?.inlineDisplay,
                    markerPaneTransform: snapshot.markerPane?.transform,
                    svgDisplay: snapshot.svg?.display,
                    svgSize: [snapshot.svg?.width, snapshot.svg?.height],
                    svgPaneDisplay: snapshot.svgPane?.display,
                    svgPaneInlineDisplay: snapshot.svgPane?.inlineDisplay,
                    svgPaneTransform: snapshot.svgPane?.transform,
                    overlayPaneDisplay: snapshot.overlayPane?.display,
                    overlayPaneTransform: snapshot.overlayPane?.transform,
                    overlayPaneZoom: snapshot.overlayPane?.zoom,
                    sdk: snapshot.sdk
                });
                return snapshot;
            }

            function summarizeTrace(trace) {
                const frames = trace.frames;
                const hidden = frames.filter((frame) => frame.markerPane?.display === 'none');
                const zero = frames.filter((frame) => !frame.marker?.width || !frame.marker?.height);
                const svgHidden = frames.filter((frame) => frame.svgPane?.display === 'none');
                const svgZero = frames.filter((frame) => !frame.svg?.width || !frame.svg?.height);
                const firstHidden = hidden[0]?.elapsed ?? null;
                const lastHidden = hidden.at(-1)?.elapsed ?? null;
                const restored = firstHidden === null
                    ? null
                    : frames.find((frame) => frame.elapsed > lastHidden && frame.markerPane?.display !== 'none')?.elapsed ?? null;
                return {
                    trigger: trace.trigger,
                    startedZoom: trace.startedZoom,
                    finalZoom: valueOrNull(() => map?.getZoom?.()),
                    durationMs: Number((performance.now() - trace.startedAt).toFixed(3)),
                    frameCount: trace.frameCount,
                    transitionCount: frames.length,
                    markerPaneHidden: hidden.length > 0,
                    markerZeroSized: zero.length > 0,
                    svgPaneHidden: svgHidden.length > 0,
                    svgZeroSized: svgZero.length > 0,
                    firstHiddenMs: firstHidden,
                    lastHiddenMs: lastHidden,
                    restoredMs: restored,
                    events: trace.events,
                    transitions: frames.map(({ signature, ...frame }) => frame),
                    environment: {
                        build: state.build,
                        url: location.href,
                        origin: location.origin,
                        userAgent: navigator.userAgent,
                        platform: navigator.platform,
                        maxTouchPoints: navigator.maxTouchPoints,
                        viewport: viewportSummary(),
                        sdk: sdkState()
                    }
                };
            }

            function finishTrace(trace) {
                if (activeTrace !== trace || trace.finished) return;
                trace.finished = true;
                const report = summarizeTrace(trace);
                state.reports.push(report);
                state.lastReport = report;
                activeTrace = null;
                elements.lastResult.textContent = JSON.stringify(report, null, 2);
                updateEnvironment();
                setStatus(
                    report.markerPaneHidden || report.svgPaneHidden
                        ? `재현됨: marker=${report.markerPaneHidden}, SVG=${report.svgPaneHidden}`
                        : '이번 줌에서는 두 오버레이 모두 유지됨',
                    report.markerPaneHidden || report.svgPaneHidden ? 'error' : 'ok'
                );
            }

            function startTrace(trigger) {
                if (activeTrace) return activeTrace;
                const trace = {
                    trigger,
                    startedAt: performance.now(),
                    startedZoom: valueOrNull(() => map?.getZoom?.()),
                    frameCount: 0,
                    frames: [],
                    events: [],
                    idleAt: null,
                    finished: false,
                    previousSignature: null
                };
                activeTrace = trace;
                setStatus(`측정 중: ${trigger}`);

                function sample() {
                    if (activeTrace !== trace || trace.finished) return;
                    trace.frameCount += 1;
                    const frame = currentFrame(trace);
                    if (frame.signature !== trace.previousSignature) {
                        trace.frames.push(frame);
                        trace.previousSignature = frame.signature;
                    }

                    const elapsed = performance.now() - trace.startedAt;
                    const idleComplete = trace.idleAt !== null && performance.now() - trace.idleAt >= RESTORE_GRACE_MS;
                    if (idleComplete || elapsed >= TRACE_LIMIT_MS) {
                        finishTrace(trace);
                        return;
                    }
                    requestAnimationFrame(sample);
                }

                requestAnimationFrame(sample);
                return trace;
            }

            function recordEvent(name) {
                if (!activeTrace && name === 'zooming') startTrace('gesture-or-sdk');
                if (!activeTrace) return;
                activeTrace.events.push({
                    name,
                    elapsed: Number((performance.now() - activeTrace.startedAt).toFixed(3)),
                    zoom: valueOrNull(() => map?.getZoom?.())
                });
                if (name === 'idle') activeTrace.idleAt = performance.now();
            }

            function updateControls() {
                if (!map) return;
                const zoom = map.getZoom();
                elements.zoomLevel.value = String(zoom);
                elements.zoomLevel.textContent = String(zoom);
                elements.zoomIn.disabled = zoom >= MAX_ZOOM;
                elements.zoomOut.disabled = zoom <= MIN_ZOOM;
                updateEnvironment();
            }

            async function copyReport() {
                const payload = JSON.stringify({
                    current: {
                        build: state.build,
                        url: location.href,
                        origin: location.origin,
                        browser: browserSummary(),
                        viewport: viewportSummary(),
                        sdk: sdkState(),
                        sdkLoad: state.sdkLoad,
                        authFailure: state.authFailure,
                        authFailureAt: state.authFailureAt
                    },
                    reports: state.reports
                }, null, 2);
                try {
                    await navigator.clipboard.writeText(payload);
                    setStatus('진단 결과를 클립보드에 복사함', 'ok');
                } catch (_) {
                    const textarea = document.createElement('textarea');
                    textarea.value = payload;
                    textarea.style.position = 'fixed';
                    textarea.style.left = '-10000px';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    textarea.remove();
                    setStatus('진단 결과를 클립보드에 복사함', 'ok');
                }
            }

            function handleAuthFailure() {
                updateEnvironment();
                setStatus(`OpenAPI 인증 실패: ${location.origin} 등록 확인`, 'error');
                elements.lastResult.textContent = JSON.stringify({
                    type: 'navermap_authFailure',
                    origin: location.origin,
                    url: location.href,
                    sdkLoad: state.sdkLoad,
                    userAgent: navigator.userAgent
                }, null, 2);
            }

            function initialize() {
                updateEnvironment();
                if (state.authFailure) {
                    handleAuthFailure();
                    return;
                }
                if (!window.naver?.maps?.Map) {
                    setStatus(`SDK 시작 실패: ${state.sdkLoad}`, 'error');
                    return;
                }

                const center = new naver.maps.LatLng(35.2846659, 129.0183832);
                map = new naver.maps.Map('map', {
                    center,
                    zoom: 17,
                    minZoom: MIN_ZOOM,
                    maxZoom: MAX_ZOOM,
                    mapTypeId: naver.maps.MapTypeId.SATELLITE,
                    mapTypeControl: false,
                    scaleControl: false,
                    zoomControl: false,
                    overlayZoomEffect: 'all'
                });
                marker = new naver.maps.Marker({ map, position: center });

                function SvgOverlay(position) {
                    this.position = position;
                    this.element = document.createElement('div');
                    this.element.className = 'diagnostic-svg-overlay';
                    this.element.setAttribute('aria-label', 'SVG 도형 오버레이');
                    this.element.style.cssText = 'position:absolute;width:54px;height:54px;pointer-events:none;';
                    this.element.innerHTML = `
                        <svg viewBox="0 0 54 54" width="54" height="54" aria-hidden="true">
                            <rect x="4" y="4" width="46" height="46" rx="6"
                                fill="rgba(255,235,59,.3)" stroke="#ff1744" stroke-width="4" />
                            <path d="M11 27h32M27 11v32" stroke="#ff1744" stroke-width="3" />
                        </svg>`;
                }

                SvgOverlay.prototype = new naver.maps.OverlayView();
                SvgOverlay.prototype.constructor = SvgOverlay;
                SvgOverlay.prototype.onAdd = function () {
                    this.getPanes().overlayLayer.appendChild(this.element);
                };
                SvgOverlay.prototype.draw = function () {
                    const offset = this.getProjection().fromCoordToOffset(this.position);
                    this.element.style.left = `${Math.round(offset.x - 27)}px`;
                    this.element.style.top = `${Math.round(offset.y - 27)}px`;
                };
                SvgOverlay.prototype.onRemove = function () {
                    this.element.remove();
                };

                svgOverlay = new SvgOverlay(new naver.maps.LatLng(35.2846659, 129.0187332));
                svgOverlay.setMap(map);

                elements.zoomIn.addEventListener('click', () => {
                    startTrace('button-in');
                    map.setZoom(Math.min(MAX_ZOOM, map.getZoom() + 1), true);
                });
                elements.zoomOut.addEventListener('click', () => {
                    startTrace('button-out');
                    map.setZoom(Math.max(MIN_ZOOM, map.getZoom() - 1), true);
                });
                elements.copyReport.addEventListener('click', copyReport);
                elements.clearReport.addEventListener('click', () => {
                    state.reports = [];
                    state.lastReport = null;
                    elements.lastResult.textContent = '기록을 초기화했습니다. 다시 줌을 실행하세요.';
                    setStatus('진단 준비 완료', 'ok');
                });

                ['zooming', 'zoom_changed', 'idle'].forEach((eventName) => {
                    naver.maps.Event.addListener(map, eventName, () => {
                        recordEvent(eventName);
                        updateControls();
                    });
                });

                state.map = map;
                state.marker = marker;
                state.svgOverlay = svgOverlay;
                state.getReport = () => state.lastReport;
                updateControls();
                setStatus('진단 준비 완료', 'ok');
            }

            window.addEventListener('naver-map-auth-failure', handleAuthFailure);
            window.addEventListener('resize', updateEnvironment);
            window.addEventListener('orientationchange', () => setTimeout(updateEnvironment, 150));
            initialize();
        })();
    </script>
</body>

</html>
